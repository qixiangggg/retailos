<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 640" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .tier-label { font-size: 12px; fill: #64748b; font-weight: 600; letter-spacing: .5px; }
      .host { font-size: 12px; fill: #94a3b8; }
      .title { font-size: 17px; fill: #0f172a; font-weight: 700; }
      .sub { font-size: 12.5px; fill: #475569; }
      .layer-t { font-size: 13.5px; fill: #1e293b; font-weight: 600; }
      .layer-s { font-size: 11.5px; fill: #64748b; }
      .edge { font-size: 11.5px; fill: #475569; }
      .edge-bg { fill: #ffffff; }
      .note { font-size: 11px; fill: #94a3b8; }
    </style>
  </defs>

  <rect width="920" height="640" fill="#f8fafc"/>
  <text x="40" y="44" style="font-size:22px; fill:#0f172a; font-weight:800;">RetailOS — System Architecture</text>
  <text x="40" y="66" class="note">Expiry tracking for a 7-Eleven store · scan → log → dashboard → write-off</text>

  <!-- CLIENT TIER -->
  <text x="40" y="112" class="tier-label">CLIENT</text>
  <rect x="40" y="124" width="220" height="150" rx="10" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
  <text x="60" y="152" class="title">React + TypeScript</text>
  <text x="60" y="174" class="sub">Vite · Tailwind CSS</text>
  <text x="60" y="200" class="sub">• Phone barcode scan</text>
  <text x="60" y="220" class="sub">  (html5-qrcode)</text>
  <text x="60" y="244" class="sub">• Log / dashboard / write-off</text>
  <text x="60" y="266" class="host">Hosted on Vercel</text>

  <!-- API TIER -->
  <text x="350" y="112" class="tier-label">API</text>
  <rect x="350" y="124" width="300" height="330" rx="10" fill="#ffffff" stroke="#34d399" stroke-width="2"/>
  <text x="370" y="152" class="title">Spring Boot 3 · Java 21</text>
  <text x="370" y="174" class="host">Hosted on Render (Docker)</text>

  <!-- layers -->
  <rect x="370" y="190" width="260" height="56" rx="7" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="384" y="214" class="layer-t">Controller</text>
  <text x="384" y="232" class="layer-s">REST endpoints · validation · central error handler</text>

  <rect x="370" y="256" width="260" height="56" rx="7" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="384" y="280" class="layer-t">Service</text>
  <text x="384" y="298" class="layer-s">@Transactional · write-off invariant · urgency buckets</text>

  <rect x="370" y="322" width="260" height="56" rx="7" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="384" y="346" class="layer-t">Repository (Spring Data JPA)</text>
  <text x="384" y="364" class="layer-s">dashboard query · SUM over write-offs</text>

  <rect x="370" y="388" width="260" height="48" rx="7" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="384" y="408" class="layer-t">Flyway</text>
  <text x="384" y="425" class="layer-s">versioned schema migrations</text>

  <!-- DATA TIER -->
  <text x="740" y="112" class="tier-label">DATA</text>
  <rect x="740" y="124" width="150" height="150" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="760" y="152" class="title">PostgreSQL</text>
  <text x="760" y="176" class="host">Hosted on Neon</text>
  <text x="760" y="206" class="sub">product</text>
  <text x="760" y="226" class="sub">expiry_record</text>
  <text x="760" y="246" class="sub">writeoff · app_user</text>

  <!-- edges -->
  <line x1="260" y1="199" x2="350" y2="199" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="268" y="176" width="74" height="18" class="edge-bg"/>
  <text x="272" y="189" class="edge">HTTPS / JSON</text>

  <line x1="650" y1="200" x2="740" y2="200" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="664" y="177" width="46" height="18" class="edge-bg"/>
  <text x="668" y="190" class="edge">JDBC</text>

  <!-- footer notes -->
  <text x="40" y="520" class="tier-label">KEY FLOWS</text>
  <text x="40" y="546" class="sub">Scan barcode → look up product → log batch (find-or-create product, insert expiry_record)</text>
  <text x="40" y="568" class="sub">Dashboard → batches with remaining stock, grouped by urgency (today injected via store-timezone Clock)</text>
  <text x="40" y="590" class="sub">Write-off → @Transactional check: SUM(write-offs) + new ≤ batch quantity, then insert</text>

  <text x="40" y="620" class="note">camelCase JSON contract end to end · errors return a consistent shape · every action attributed to a user</text>
</svg>
